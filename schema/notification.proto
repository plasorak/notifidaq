syntax = "proto3";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
package dunedaq.notifidaq;

enum SystemType {
  UNKNOWN = 0;
  CONTROLLER = 1;
  DAQ_APPLICATION = 2;
  PROCESS_MANAGER = 3;
  SESSION_MANAGER = 4;
  RESOURCE_MANAGER = 5;
  AUTHORISER_SERVICE = 6;
};

enum NotificationType {
  Modules_Initialised = 0;
  Controller_FoundChildren = 1;
};

message Origin {
    SystemType system = 1;
    string instance_name = 2;
    optional string session_name = 3;
};

message Notification {
    Origin source = 1;
    google.protobuf.Timestamp timestamp = 2;
    NotificationType notification_type = 3;
    google.protobuf.Any payload = 4;
};
